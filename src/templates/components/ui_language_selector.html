<button type="button" aria-expanded="false" aria-controls="language-menu" aria-haspopup="true">[[= currentLanguage.toUpperCase() ]]</button>
<ul id="language-menu">
  [[for(const lang of languages){]]
  <li><a href="[[= helpers.urlFor(currentRouteName, { lang: lang }) ]]">[[= lang ]]</a></li>
  [[}]]
</ul>
