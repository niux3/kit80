[[extends:base]]

[[block:content]]
  <h1>[[= title ]]</h1>
  <p class="lead">[[= description ]]</p>
  <section class="features-list">
    <h2>[[= title2 ]]</h2>
    <ul>
    [[for(const spec of specs){]]
        <li>
          <span>[[= spec.name ]]</span>
          <strong>[[= spec.value ]]</strong>
        </li>
    [[}]]
    </ul>
  </section>

  <p style="margin-top: 2rem;">
    <a href="/">← [[= text_link ]]</a>
  </p>
[[/block]]
