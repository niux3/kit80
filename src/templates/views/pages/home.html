[[extends:base]]
[[block:content]]
  <h1>[[= title ]]</h1>
  <p>Framework SPA ultra-léger basé sur les standards W3C.</p>

  <section class="features-list">
    <h2>État des modules core</h2>
    <ul>
    [[for(const feature of features){]]
      <li>
        <span class="label">[[= feature.label ]]</span>
        <span class="status">[[= feature.status ]]</span>
      </li>
    [[}]]
    </ul>
  </section>
[[/block]]
